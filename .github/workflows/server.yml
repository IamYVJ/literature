# ============================================================================
# Build the Literature server image for the Pi.
#
# WHY arm64 IS SPELLED OUT
#   The runner is x86_64 and the Pi is aarch64. A default `docker build` here would
#   produce an amd64 image that pushes fine, pulls fine, and then dies on the Pi
#   with "exec format error" — so the platform is explicit and QEMU is installed to
#   emulate it. This is the single most common way this deployment goes wrong.
#
# WHY THERE ARE NO SECRETS
#   GITHUB_TOKEN is minted for this run and expires with it, and `packages: write`
#   is enough to push to GHCR under this repository's owner. A personal access
#   token would be a long-lived credential in the repo settings for no gain.
#
# AFTER THE FIRST SUCCESSFUL RUN
#   The new package defaults to PRIVATE. Make it public once — Settings on the
#   package page — or the Pi cannot pull it without being handed a credential.
# ============================================================================
name: server image

on:
  push:
    branches: [main]
    # The image contains the server AND the shared engine, so a change to the game
    # rules has to rebuild it. Missing these paths would leave the Pi playing by
    # last month's rules while the browser plays by this month's — the exact drift
    # js/intents.js exists to prevent, reintroduced through the deployment.
    #
    # js/guards.js is on this list for the same reason but one step further out:
    # server/guards.js is a thin wrapper that re-exports it, so tightening a bound
    # there changes what the Pi accepts. Leaving it off would mean the browser
    # rejecting a frame the server still lets through.
    #
    # js/bots.js and js/botdriver.js are here because on this transport the SERVER
    # is what plays the bots and what plays an empty chair — a change to either is
    # a change to how a table on the Pi behaves, not just how one browser does.
    paths:
      - 'server/**'
      - 'js/state.js'
      - 'js/rules.js'
      - 'js/cards.js'
      - 'js/intents.js'
      - 'js/guards.js'
      - 'js/util.js'
      - 'js/bots.js'
      - 'js/botdriver.js'
      - '.dockerignore'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  # Lowercase and hardcoded: GHCR rejects mixed-case names, and
  # github.repository_owner is "IamYVJ".
  IMAGE: ghcr.io/iamyvj/literature-server

jobs:
  # The tests need no install at all (that is why server/guards.js has no
  # dependencies), so this job is seconds long and gates a build that is minutes
  # long under emulation. `npm test` runs the engine, the bots and the server
  # suites — the last of which plays whole games through Session.handleFrame().
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Lets the x86 runner execute arm64 binaries during the build.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root, not server/ — the image needs js/ as well.
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          # :latest is what the Pi watches; the sha tag is what makes a rollback
          # possible without a rebuild.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Say what to pull
        run: |
          echo "Pushed ${{ env.IMAGE }}:latest"
          echo "     and ${{ env.IMAGE }}:${{ github.sha }}"
          echo "Check the deployed build with: curl -s https://<host>/literature/health"
