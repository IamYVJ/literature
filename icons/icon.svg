<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Literature">
  <!-- Reading-room dark, with a lamp above -->
  <rect width="512" height="512" fill="#0A0F16"/>
  <radialGradient id="lamp" cx="50%" cy="6%" r="115%">
    <stop offset="0" stop-color="#18212F"/>
    <stop offset="0.65" stop-color="#0A0F16"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#lamp)"/>

  <!-- Three cards fanned about a point below the frame: a hand you hold, and
       nobody else sees. The two behind are dimmer so the fan reads as depth. -->
  <g stroke="#1E242B" stroke-width="5">
    <rect x="182" y="138" width="148" height="210" rx="18" fill="#CFC6B2" transform="rotate(-24 256 393)"/>
    <rect x="182" y="138" width="148" height="210" rx="18" fill="#CFC6B2" transform="rotate(24 256 393)"/>
    <rect x="182" y="138" width="148" height="210" rx="18" fill="#F0EADC"/>
  </g>

  <!-- Brass pip: the half-suit you are collecting -->
  <path d="M256 194 L297 243 L256 292 L215 243 Z" fill="#C9A66B"/>
</svg>
